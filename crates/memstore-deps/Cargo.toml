[package]
name = "memstore-deps"
version = "0.1.0"
edition = "2024"
description = "Dev builds only: every runtime dependency of the AmpUp Memory workspace in one dynamic library"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Dev builds only (memstore's `dylib` feature): every runtime dependency of the workspace in one dynamic library, so
# an edit relinks memstore's own code instead of statically linking Lance, DataFusion, Arrow, Iceberg and ONNX Runtime
# again.
[lib]
crate-type = ["dylib"]

