[project]
name = "ampup-memory"
version = "0.1.0"
description = "A thin Python client for an AmpUp Memory server: team memory for coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["ampup", "memory", "agents", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/A79-ai/ampup-memory"
Source = "https://github.com/A79-ai/ampup-memory/tree/main/sdk/python"
Issues = "https://github.com/A79-ai/ampup-memory/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ampup_memory"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
