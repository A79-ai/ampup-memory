# cargo-about: the licenses of every crate linked into the release binaries (memstore and memstore-client), which
# .github/scripts/third-party-notices.sh writes, with the Apache NOTICE files those crates ship and the texts in
# licenses/ (ONNX Runtime, the default embedding model), to THIRD-PARTY-NOTICES.txt.
#
# A crate under a license not accepted here fails the generation, and with it CI and the release: a new dependency
# with an unusual license is a decision, not something that ships unnoticed. Accept a permissive license here; a
# copyleft one (MPL-2.0 and the like) only for the crate that needs it, below.

# In priority order: a crate offered under a choice of licenses is listed under the first of these it offers.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# The platforms release.yml builds: a crate only another platform links (windows-sys, wasm-bindgen) isn't shipped.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

# Build scripts' own dependencies and test-only crates aren't linked into the binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# cargo-about's built-in fixes for crates whose license texts are hard to attribute. Only those that still match the
# versions in Cargo.lock: the others (clap, ring, sentry, unicode-ident, rustix, bitvec) check a checksum of an older
# release and are skipped, so listing them would only look like coverage.
workarounds = ["chrono", "prost", "rustls"]

# The workspace's own crates (publish = false) are this project, under its LICENSE, not third-party software.
[private]
ignore = true

# option-ext (through dirs-sys, which hf-hub and lance-index use) is MPL-2.0, weak copyleft at the file level:
# unmodified, it needs its license text and a pointer to its source, which the template prints for every MPL-2.0
# crate.
[option-ext]
accepted = ["MPL-2.0"]

# Clarifications: the license texts of crates whose package lacks them, holds them where cargo-about doesn't find
# them, or bundles C or C++ code under its own license. Each file is pinned by its checksum, so a new version of the
# crate fails the generation until its texts are looked at again (third-party-notices.sh fails on a clarification
# that no longer matches, which cargo-about itself only warns about).

# No license file in the package: the repository's, at the commit the package was built from.
[alloc-stdlib.clarify]
license = "BSD-3-Clause"
[[alloc-stdlib.clarify.git]]
path = "LICENSE"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

