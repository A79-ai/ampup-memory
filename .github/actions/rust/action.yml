name: Rust build setup
description: >-
  The pinned toolchain, protoc, disk space on Linux runners, and caches for cargo, target/ and the ONNX Runtime
  download, on GitHub-hosted runners with nothing but the workflow's own GITHUB_TOKEN.
inputs:
  target:
    description: >-
      Which build this is (test, clippy, release): each gets its own cache, so they don't evict each other.
    required: true
runs:
  using: composite
  steps:
    # A cold build of Lance, DataFusion, Arrow, Iceberg and ONNX Runtime fills most of a standard runner's free
    # disk. The preinstalled .NET, Android, Haskell and CodeQL toolchains free about 25 GB; nothing here uses them.
    - name: Free disk space
      if: runner.os == 'Linux'
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h / | tail -1
    - name: Install protoc
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: protoc
    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install && rustc -V
    # The cargo registry and target/'s compiled dependencies, in the repository's Actions cache. Only main saves,
    # so pull requests restore main's cache and never fill the cache with their own.
    - name: Cache cargo and target/
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2
      with:
        shared-key: ${{ inputs.target }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # ort-sys downloads prebuilt ONNX Runtime binaries in its build script; a flaky CDN failed a cold build.
    - name: Cache the ONNX Runtime download
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/ort.pyke.io
        key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: ort-${{ runner.os }}-${{ runner.arch }}-
