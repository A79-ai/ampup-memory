name: Release

# Two kinds of release, each from its own tags, so a change to one never re-releases the other:
#
# - `v*` (the server): the ampup-memory CLI as a GitHub release of this repository, per platform a tarball of
#   ampup-memory and ampup-memory-client with its checksum, and install.sh, which anyone can run with no sign-in:
#     curl -fsSL https://raw.githubusercontent.com/A79-ai/ampup-memory/main/install.sh | sh
# - `client-v*` (the client): ampup-memory-client alone (what the Claude Code, Cursor and Codex plugins run, a few
#   MB), per platform, installed with AMPUP_MEMORY_INSTALL=client.
#
# The binaries were memstore and memstore-client before the rename: each archive holds a `memstore` (and
# `memstore-client`) link to the binary, install.sh makes the same links, and a client release also carries its
# archive by the old name (`memstore-client-<target>.tar.gz`, the binary in it as `memstore-client`), for a plugin's
# install.sh from before the rename to update from.
#
# Push a tag to release it (git tag v0.1.0 && git push origin v0.1.0); a tag with a `-` in it (v0.2.0-rc.1) is a
# pre-release. Run it by hand (workflow_dispatch) on a tag to build and publish that tag again: files already on its
# release are replaced. Only the workflow's own GITHUB_TOKEN is used, and only the publish job may write.
#
# Each build is checked as it comes off the runner (.github/scripts/release-check.sh: ampup-memory serves a local
# store, and ampup-memory-client is its client), and once published, installed with install.sh and checked again.
#
# Every archive carries LICENSE, NOTICE and THIRD-PARTY-NOTICES.txt: the licenses of every crate linked into the
# binaries, ONNX Runtime's and the embedding model's, kept current by .github/scripts/third-party-notices.sh.
#
# Platforms: Linux x86_64 and arm64 (glibc 2.39 or newer: built on Ubuntu 24.04) and Apple Silicon macOS. No Intel
# macOS: onnxruntime (ort) ships no prebuilt library for it.
#
# macOS builds are signed with a Developer ID and notarized when the signing secrets are set
# (.github/scripts/macos-sign.sh names them); without them they're unsigned, and install.sh clears the quarantine
# flag of an unsigned binary. The secrets live in the `release` environment, which only release tags (v*,
# client-v*) may use: the build job names it, and nothing a pull request runs can reach them.
on:
  push:
    tags: ["v*", "client-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A client this run built and checks never replaces itself with the latest public release midway (its
  # session-start hook would): the release would package the previous one.
  AMPUP_MEMORY_CLIENT_UPDATE: "off"

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Dispatched on anything but a release tag, it builds nothing.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ${{ matrix.runner }}
    environment: release # the signing secrets (above)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: What this release is
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in
            client-v*) echo "kind=client" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#client-}" >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=server" >> "$GITHUB_OUTPUT"; echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: ./.github/actions/rust
        with:
          target: release
      # Both, for either kind: the check runs ampup-memory-client against ampup-memory. Only this release's kind is
      # packaged.
      - name: Build
        # --version names the release, which the plugin compares with the latest to keep the client current.
        env:
          AMPUP_MEMORY_RELEASE: ${{ steps.kind.outputs.version }}
        run: cargo build --release --locked --bin ampup-memory --bin ampup-memory-client
      # Stripped before signing (stripping a signed binary breaks its signature), and both checked as they ship.
      - name: Strip
        run: strip target/release/ampup-memory target/release/ampup-memory-client
      # Every macOS build: signed with the Developer ID certificate and notarized by Apple when the signing secrets
      # are set, unsigned as before (and it says so) when they aren't. .github/scripts/macos-sign.sh says which.
      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: .github/scripts/macos-sign.sh target/release/ampup-memory target/release/ampup-memory-client
      - name: Check the build
        run: .github/scripts/release-check.sh target/release/ampup-memory target/release/ampup-memory-client
      # The committed THIRD-PARTY-NOTICES.txt must be what the script makes of this Cargo.lock (a crate under a
      # license about.toml doesn't accept fails it too), checked on the Linux builds; the release publishes nothing
      # unless every build passed.
      - name: Third-party notices are current
        if: runner.os == 'Linux'
        run: |
          .github/scripts/third-party-notices.sh "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
          cmp -s THIRD-PARTY-NOTICES.txt "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt" || {
            diff -u THIRD-PARTY-NOTICES.txt "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt" | head -40
            echo "::error file=THIRD-PARTY-NOTICES.txt::stale: run .github/scripts/third-party-notices.sh THIRD-PARTY-NOTICES.txt"
            exit 1
          }
      - name: Package
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          TARGET: ${{ matrix.target }}
        run: |
          # The binaries beside the license, the notice and the third-party notices, all at the archive's top, each
          # binary with a link by its old name (memstore, memstore-client).
          docs=(LICENSE NOTICE THIRD-PARTY-NOTICES.txt)
          for f in "${docs[@]}"; do test -s "$f" || { echo "::error::$f is missing"; exit 1; }; done
          pkg=$RUNNER_TEMP/pkg
          mkdir -p "$pkg"
          if [ "$KIND" = client ]; then bins=(ampup-memory-client); else bins=(ampup-memory ampup-memory-client); fi
          names=()
          for b in "${bins[@]}"; do
            cp "target/release/$b" "$pkg/$b"
            old=memstore${b#ampup-memory}
            ln -s "$b" "$pkg/$old"
            names+=("$b" "$old")
          done
          cp "${docs[@]}" "$pkg/"
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$1" > "$1.sha256"; else shasum -a 256 "$1" > "$1.sha256"; fi; cat "$1.sha256"; }
          name=ampup-memory; [ "$KIND" = client ] && name=ampup-memory-client
          asset=$name-$TARGET.tar.gz
          tar -czf "$asset" -C "$pkg" "${names[@]}" "${docs[@]}"
          tar -tzvf "$asset"
          sum "$asset"
          # The client by its old name too, the binary itself as memstore-client (never a link): what a plugin's
          # install.sh from before the rename downloads and installs. Dropped with the memstore-client link.
          if [ "$KIND" = client ]; then
            legacy=$RUNNER_TEMP/legacy
            mkdir -p "$legacy"
            cp target/release/ampup-memory-client "$legacy/memstore-client"
            asset=memstore-client-$TARGET.tar.gz
            tar -czf "$asset" -C "$legacy" memstore-client -C "$pkg" "${docs[@]}"
            sum "$asset"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ampup-memory-${{ matrix.target }}
          path: |
            ampup-memory-*${{ matrix.target }}.tar.gz*
            memstore-client-${{ matrix.target }}.tar.gz*
          retention-days: 1 # only carries the build to this run's publish job; the release keeps the files

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: ampup-memory-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-v*-*|v*-*) prerelease="--prerelease" ;; esac
          case "$GITHUB_REF_NAME" in
            client-v*) title="ampup-memory-client ${GITHUB_REF_NAME#client-}" ;;
            *) title="ampup-memory $GITHUB_REF_NAME" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* install.sh $prerelease --generate-notes --title "$title"
          fi

  verify:
    name: Install on ${{ matrix.runner }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    # As a stranger installs it: install.sh from this tag, downloading from this repository's public releases with
    # no token.
    env:
      AMPUP_MEMORY_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A client release is checked against the newest server release, as a user would run them together: no
      # version named, so install.sh picks it.
      - name: Install the server
        env:
          AMPUP_MEMORY_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          case "$GITHUB_REF_NAME" in client-v*) ;; *) export AMPUP_MEMORY_VERSION="$GITHUB_REF_NAME" ;; esac
          sh install.sh
      - name: Install the client alone, as the plugins need
        if: startsWith(github.ref_name, 'client-v')
        env:
          AMPUP_MEMORY_VERSION: ${{ github.ref_name }}
          AMPUP_MEMORY_INSTALL_DIR: ${{ runner.temp }}/client
          AMPUP_MEMORY_INSTALL: client
        run: sh install.sh
      - name: Check what it installed
        run: |
          # The server by its new name, or by its old one where the newest server release is from before the rename;
          # each check through the old name's link too.
          server=$RUNNER_TEMP/bin/ampup-memory
          [ -x "$server" ] || server=$RUNNER_TEMP/bin/memstore
          if [ -x "$RUNNER_TEMP/client/ampup-memory-client" ]; then
            client=$RUNNER_TEMP/client
          else
            client=$RUNNER_TEMP/bin
          fi
          test -L "$client/memstore-client"
          .github/scripts/release-check.sh "$server" "$client/ampup-memory-client"
          .github/scripts/release-check.sh "$server" "$client/memstore-client"
